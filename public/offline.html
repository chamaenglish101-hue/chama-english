<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1220" />
    <title>Sem conexão — Chama English</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(
            circle at 50% 0%,
            rgba(56, 189, 248, 0.16),
            transparent 60%
          ),
          #0b1220;
        color: #e8eefc;
        font-family:
          "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 380px;
        text-align: center;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(148, 197, 255, 0.18);
        border-radius: 24px;
        padding: 32px 24px;
      }
      svg {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 16px 0 0;
        font-size: 20px;
        line-height: 1.3;
        font-weight: 800;
      }
      p {
        margin: 10px 0 0;
        font-size: 14px;
        line-height: 1.6;
        color: #a9b8d4;
      }
      button {
        margin-top: 22px;
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 16px;
        background: #38bdf8;
        color: #07131f;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      .hint {
        margin-top: 16px;
        font-size: 12px;
        color: #7f90b0;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="flame" x1="32" y1="4" x2="32" y2="56">
            <stop offset="0" stop-color="#67e8f9" />
            <stop offset="1" stop-color="#2563eb" />
          </linearGradient>
        </defs>
        <path
          d="M32 4c8 9 4 13 8 18 3 4 8 7 8 16a16 16 0 0 1-32 0c0-7 4-10 7-14 3-4 5-8 9-20Z"
          fill="url(#flame)"
        />
        <circle cx="25" cy="34" r="6" stroke="#07131f" stroke-width="2.4" />
        <circle cx="39" cy="34" r="6" stroke="#07131f" stroke-width="2.4" />
        <path d="M31 34h2" stroke="#07131f" stroke-width="2.4" />
      </svg>
      <h1>Você está sem internet</h1>
      <p>
        As lições do Chama English precisam de conexão para abrir. Confira o
        sinal ou o Wi-Fi e tente de novo.
      </p>
      <button type="button" onclick="window.location.reload()">
        Tentar de novo
      </button>
      <p class="hint">O que você já estudou continua salvo neste aparelho.</p>
    </main>
  </body>
</html>
